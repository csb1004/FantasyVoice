[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasyvoice"
version = "0.1.0"
description = "Character voice dataset inventory and Korean transcription pilot"
requires-python = ">=3.10"
dependencies = ["soundfile==0.13.1"]

[project.optional-dependencies]
asr = ["openai-whisper==20250625"]
predictor = ["torch>=2.6,<3", "transformers==4.57.6", "huggingface-hub>=0.34,<1", "safetensors>=0.4.3"]
tts = [
  "torch>=2.6,<3", "transformers==4.57.6", "huggingface-hub>=0.34,<1", "safetensors>=0.4.3",
  "librosa==0.11.0", "numba==0.61.2", "numpy>=1.26,<2.3", "scipy>=1.10",
  "g2pkk==0.1.2", "jamo==0.4.1", "anyascii", "num2words", "einops",
  "python-mecab-ko==1.3.7; sys_platform == 'linux' and python_version < '3.13'",
  "python-mecab-ko-py313==1.3.7.dev0; sys_platform == 'linux' and python_version == '3.13'",
  "python-mecab-ko-dic==2.1.1.post2; sys_platform == 'linux'"
]
style = [
  "funasr==1.4.16", "torchcrepe==0.0.24", "silero-vad==6.2.2",
  "onnxruntime==1.24.4",
  "python-mecab-ko==1.3.7; sys_platform == 'linux' and python_version < '3.13'",
  "python-mecab-ko-py313==1.3.7.dev0; sys_platform == 'linux' and python_version == '3.13'",
  "python-mecab-ko-dic==2.1.1.post2; sys_platform == 'linux'",
  "transformers>=4.51,<5", "huggingface-hub>=0.34,<1",
  "g2pkk==0.1.2", "jamo==0.4.1", "anyascii", "num2words", "einops",
  "scipy>=1.10", "numpy>=1.26,<3"
]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
